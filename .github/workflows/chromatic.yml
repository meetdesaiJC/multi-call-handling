name: Publish Storybook to Chromatic

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromatic:
    runs-on: ubuntu-latest
    # Chromatic needs full git history to compare against a baseline
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Skips safely until the CHROMATIC_PROJECT_TOKEN secret is added.
      # The action builds Storybook (npm run build-storybook) and publishes it.
      - name: Publish to Chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        uses: chromaui/action@latest
        with:
          projectToken: ${{ env.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
